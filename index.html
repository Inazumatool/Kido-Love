<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>イナクロ対戦記録</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#141C33; --muted:#5D6681; --line:#D5DAE6;
  --volt:#FFD21F; --blue:#2147B8; --blue-soft:#E3E9FA;
  --win:#1D8A4E; --win-soft:#E1F3E8; --lose:#C0322F; --lose-soft:#FBE7E7; --draw:#5D6681; --draw-soft:#ECEEF3;
  --warn:#9A5B00; --warn-soft:#FFF1D6;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-num:"Chakra Petch","Zen Kaku Gothic New",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0D1222; --surface:#161D33; --surface-2:#1C2540; --ink:#E9EDF7; --muted:#9AA3BE; --line:#2C3656;
  --blue:#8DA8FF; --blue-soft:#22305A; --win:#4FD08A; --win-soft:#173524; --lose:#FF8A80; --lose-soft:#3D1D22; --draw:#9AA3BE; --draw-soft:#252E48;
  --warn:#FFB84D; --warn-soft:#3A2E17; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bolt{width:32px;height:32px;flex:none;background:var(--volt);clip-path:polygon(58% 0,10% 56%,44% 56%,34% 100%,90% 40%,55% 40%)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,5vw,28px);line-height:1.15;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;min-height:42px}
.btn.volt{background:var(--volt);border-color:var(--volt);color:#141C33}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
/* ログイン画面 */
.lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.lockbox{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
.lockbox p{margin:0}
.lockbox .hint{font-size:12px;color:var(--muted)}
.lockseg{display:grid;grid-template-columns:1fr 1fr;width:100%}
.lockseg button{padding:9px 6px;font-size:13px}
.lockbox input{width:100%;height:48px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font:700 18px var(--f-num);letter-spacing:.06em;text-transform:uppercase}
.lockbox input.plain{font:500 17px var(--f-body);letter-spacing:0;text-transform:none}
.lockbox input::placeholder{font:500 15px var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted);opacity:1}
.lockbox .btn{width:100%}
.lockbox .btn+.btn{margin-top:-4px}
.err{min-height:1.2em;color:var(--lose);font-size:13px;font-weight:700}
#loading .lockbox p{text-align:center;font-weight:700}
/* 名前バッジ・透かし・お知らせ */
.mebadge{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);margin-left:auto;flex-wrap:wrap}
.mebadge button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;color:var(--muted)}
.wmark{position:fixed;inset:-50%;z-index:2147483000;pointer-events:none;display:flex;flex-wrap:wrap;gap:46px 70px;align-content:flex-start;transform:rotate(-24deg);opacity:.07;font-size:15px;font-weight:700;color:var(--ink);overflow:hidden;user-select:none}
.wmark span{white-space:nowrap}
.gtoast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:2147483600;max-width:calc(100% - 32px)}
</style></head>
<body>
<div id="loading" class="lock"><div class="lockbox"><div class="brand"><div class="bolt" aria-hidden="true"></div><h1>対戦記録</h1></div><p id="loadingMsg">読み込み中…</p></div></div>
<div id="lockScreen" class="lock" hidden></div>
<div id="appWrap" hidden></div>
<script>
/* ↓ ウェブアプリのURL（Apps Script の「デプロイを管理」でコピーしたもの） */
/* ===== 入口：ログイン → 本体を受け取って起動（試練ツールと同じ仕組み） ===== */
(function(){
const API_URL="https://script.google.com/macros/s/AKfycbyOEHCLp2PCssm4lHKkn7JZkFPbnEkGS0Y7IS3QpMjGH_aogeMQuuCS-La_9VIb8ZwW/exec";
const DEVKEY='inazuma-match-dev', TOKKEY='inazuma-match-session';
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DEV=ls.get(DEVKEY); if(!DEV){DEV=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());ls.set(DEVKEY,DEV)}
// Apps Script を fetch で呼ぶ（Cookie を送らないので、Googleのログイン状態に左右されない）
async function call(fn,...args){
  if(!/^https:\/\/script\.google\.com\//.test(API_URL))throw new Error('index.html の API_URL に、ウェブアプリのURLが入っていません');
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),credentials:'omit',redirect:'follow'});
  if(!r.ok)throw new Error('サーバーの応答 '+r.status);
  const t=await r.text(); let j; try{j=JSON.parse(t)}catch(e){throw new Error('サーバーの応答がおかしい：'+t.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,80))} if(j.err)throw new Error(j.err); return j.r;
}
const UA=()=>{const u=navigator.userAgent;const os=/iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows':/Mac/.test(u)?'Mac':'その他';const br=/Edg\//.test(u)?'Edge':/CriOS|Chrome\//.test(u)?'Chrome':/FxiOS|Firefox/.test(u)?'Firefox':/Safari/.test(u)?'Safari':'その他';return os+' / '+br+' / '+screen.width+'x'+screen.height};

/* だいたいの地域（IPから）。取れなくてもログインは続ける */
let GEO=null;
async function geo(){
  if(GEO)return GEO;
  const get=async(url,map)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),3000);try{const r=await fetch(url,{signal:c.signal});return map(await r.json())}finally{clearTimeout(t)}};
  try{GEO=await get('https://ipapi.co/json/',j=>{if(!j||j.error)throw 0;return{ip:j.ip,region:j.region,city:j.city,country:j.country_name}})}catch(e){
    try{GEO=await get('https://ipwho.is/',j=>{if(!j||j.success===false)throw 0;return{ip:j.ip,region:j.region,city:j.city,country:j.country}})}catch(e2){GEO={}}}
  return GEO;
}
geo();

/* 画面の出し分け */
function showOnly(id){['loading','lockScreen','appWrap'].forEach(x=>{const e=$(x);if(e)e.hidden=(x!==id)});const wm=document.querySelector('.wmark');if(wm)wm.hidden=(id!=='appWrap')}
function loading(msg){$('loadingMsg').textContent=msg||'読み込み中…';showOnly('loading')}
const brand='<div class="brand"><div class="bolt" aria-hidden="true"></div><h1>対戦記録</h1></div>';

let MODE='code', HASPASS=false, TIMER=0, TOKEN=null;
function lockUI(msg){
  stopCheck();
  const el=$('lockScreen');
  el.innerHTML=`<form class="lockbox" id="lockForm" novalidate>${brand}
    <p>クラブメンバー専用です。</p>
    <div class="seg lockseg" role="tablist"><button type="button" data-mode="code" aria-pressed="${MODE==='code'}">コードで入る</button><button type="button" data-mode="pass" aria-pressed="${MODE==='pass'}">IDとパスワード</button></div>
    ${MODE==='code'?`<input id="lockCode" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="メンバーコード" aria-label="メンバーコード">
    <p class="hint">はじめての人は、管理者から受け取ったメンバーコードで入ってください。パスワードを決めた人は「IDとパスワード」で入ります。</p>`
    :`<input id="lockId" class="plain" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="ゲームID" aria-label="ゲームID">
    <input id="lockPass" class="plain" type="password" autocomplete="current-password" placeholder="パスワード" aria-label="パスワード">
    <p class="hint">パスワードは、一度メンバーコードで入ったあとに決められます。忘れたときは管理者へ。</p>`}
    <button class="btn volt" type="submit">ログイン</button><div class="err" id="lockErr" role="alert"></div></form>`;
  showOnly('lockScreen'); window.scrollTo(0,0);
  $('lockErr').textContent=msg||'';
  el.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{MODE=b.dataset.mode;lockUI('')}));
  $('lockForm').addEventListener('submit',async ev=>{
    ev.preventDefault(); const err=$('lockErr'), btn=ev.target.querySelector('button[type=submit]');
    const req={via:MODE,dev:DEV,ua:UA()};
    if(MODE==='code'){req.code=$('lockCode').value;if(!req.code.trim()){err.textContent='メンバーコードを入れてください。';return}}
    else{req.id=$('lockId').value;req.pass=$('lockPass').value;if(!req.id||!req.pass){err.textContent='ゲームIDとパスワードを入れてください。';return}}
    err.textContent='確認中…'; btn.disabled=true;
    req.geo=await geo();
    let r=null; try{r=await call('login',req)}catch(e){err.textContent='通信できませんでした（'+String(e&&e.message||e).slice(0,120)+'）';btn.disabled=false;return}
    if(!r.ok){err.textContent=r.msg;btn.disabled=false;if(/パスワードを決めてある/.test(r.msg)){MODE='pass';lockUI(r.msg)}return}
    ls.set(TOKKEY,r.token); HASPASS=!!r.hasPass;
    if(MODE==='code'&&!r.hasPass)return passUI(r.token,r.me,true);
    boot(r.token,r.me);
  });
}

/* パスワードを決める画面。first=true ならログイン直後（「あとで」で本体へ） */
function passUI(token,me,first){
  const el=$('lockScreen');
  el.innerHTML=`<form class="lockbox" id="passForm" novalidate>${brand}
    <p>${first?'パスワードを決めると、次からは<b>ゲームID</b>と<b>パスワード</b>で入ります。':'新しいパスワードを決めます。'}</p>
    ${first?'<p class="hint">決めたあとは、メンバーコードでは入れなくなります（コードが人に知られても、あなたのアカウントに入られないようにするためです）。</p>':''}
    <p class="hint">ゲームID：${esc(me.gid)||'（メンバー表に未登録）'}</p>
    ${HASPASS?'<input id="pw0" class="plain" type="password" autocomplete="current-password" placeholder="今のパスワード" aria-label="今のパスワード">':''}
    <input id="pw1" class="plain" type="password" autocomplete="new-password" placeholder="${HASPASS?'新しいパスワード（8文字以上）':'パスワード（8文字以上）'}" aria-label="新しいパスワード">
    <input id="pw2" class="plain" type="password" autocomplete="new-password" placeholder="もう一度" aria-label="パスワードをもう一度">
    <button class="btn volt" type="submit">このパスワードにする</button><button class="btn" type="button" id="pwLater">${first?'あとで':'やめる'}</button><div class="err" id="pwErr" role="alert"></div></form>`;
  showOnly('lockScreen'); window.scrollTo(0,0);
  const back=()=>first?boot(token,me):showOnly('appWrap');
  $('pwLater').addEventListener('click',back);
  $('passForm').addEventListener('submit',async ev=>{
    ev.preventDefault(); const a=$('pw1').value,b=$('pw2').value,cur=HASPASS?$('pw0').value:'',err=$('pwErr');
    if(HASPASS&&!cur){err.textContent='今のパスワードを入れてください。';return}
    if(a.length<8){err.textContent='8文字以上にしてください。';return}
    if(a!==b){err.textContent='2つのパスワードが違います。';return}
    err.textContent='保存中…';
    let r=null; try{r=await call('setPassword',token,a,cur)}catch(e){err.textContent='通信できませんでした。';return}
    if(!r.ok){if(r.reason)return kicked(r);err.textContent=r.msg;return}
    HASPASS=true; toast(first?'パスワードを決めました。次からは「IDとパスワード」で入ってください':'パスワードを変えました');
    back();
  });
}

/* ===== ログイン中かの確認（画面に戻ったとき・数分おき） ===== */
function stopCheck(){clearInterval(TIMER);TIMER=0;TOKEN=null}
let lastCheck=0;
async function check(force){if(!TOKEN)return;if(!force&&document.visibilityState!=='visible')return;if(Date.now()-lastCheck<20000&&!force)return;lastCheck=Date.now();try{const r=await call('ping',TOKEN);if(!r.ok)kicked(r)}catch(e){}}
window.addEventListener('focus',()=>check(true));
document.addEventListener('pointerdown',()=>check(false),{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check(true)});

/* 端末に覚えた画像を消す（ログアウト・追い出し・停止のとき） */
function clearImgs(){try{indexedDB.deleteDatabase('inazuma-match-img')}catch(e){}}
function kicked(r){
  stopCheck(); ls.del(TOKKEY); clearImgs();
  const msg=r&&r.reason==='kicked'?'別の端末でログインされたので、この端末はログアウトしました。':r&&r.msg?r.msg:'ログインの期限が切れました。もう一度ログインしてください。';
  lockUI(msg);
}
function toast(t){const d=document.createElement('div');d.className='gtoast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

/* ===== 本体を起動 ===== */
async function boot(token,me){
  loading('読み込み中…（はじめは数秒かかります）');
  let a=null; try{a=await call('loadApp',token)}catch(e){lockUI('読み込みに失敗しました（'+String(e&&e.message||e).slice(0,200)+'）');return}
  if(!a.ok){if(a.reason==='error'){lockUI(a.msg);return}return kicked(a)}
  TOKEN=token; TIMER=setInterval(check,5*60*1000);
  let P=null; try{P=JSON.parse(new TextDecoder().decode(new Uint8Array(await new Response(new Blob([Uint8Array.from(atob(a.pack),c=>c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())))}catch(e){lockUI('本体を開けませんでした（'+esc(e&&e.message||e)+'）');return}
  const w=$('appWrap'); w.innerHTML=P.view;
  showOnly('appWrap');
  // 本体からサーバーを呼ぶ口（通行証を付け、追い出されたらログイン画面へ）
  const api={call:async(fn,...args)=>{const r=await call(fn,token,...args);if(r&&r.ok===false&&/^(kicked|expired|stopped)$/.test(r.reason||'')){kicked(r);const e=new Error(r.msg||'ログアウトしました');e.kicked=true;throw e}return r},toast:toast};
  try{(new Function(P.js))();const f=window.__APP_BOOT;delete window.__APP_BOOT;f(a.data,me,api)}
  catch(e){console.error(e);w.insertAdjacentHTML('afterbegin','<p style="color:#c00;font-weight:700">起動に失敗しました：'+esc(e&&e.message||e)+'</p>')}
  mark(token,me);
}

function mark(token,me){
  const h=document.querySelector('#appWrap h1'); if(!h)return;
  const no2=String(me.no).padStart(2,'0');
  const b=document.createElement('div'); b.className='mebadge';
  const t=document.createElement('span'); t.textContent=me.master?'マスターキー':(me.name||'メンバー')+' さん（No.'+no2+'）';
  const p=document.createElement('button'); p.type='button'; p.textContent='パスワード'; p.addEventListener('click',()=>passUI(token,me,false));
  const x=document.createElement('button'); x.type='button'; x.textContent='ログアウト';
  x.addEventListener('click',async()=>{try{await call('logout',token)}catch(e){}stopCheck();ls.del(TOKKEY);clearImgs();lockUI('ログアウトしました。')});
  b.append(t,p,x); h.parentElement.appendChild(b);
  if(!me.master){const old=document.querySelector('.wmark');if(old)old.remove();
    const w=document.createElement('div'); w.className='wmark'; w.setAttribute('aria-hidden','true');
    const label=[me.name,me.gid?('ID '+me.gid):'','No.'+no2].filter(Boolean).join(' ');
    for(let i=0;i<700;i++){const s=document.createElement('span');s.textContent=label;w.appendChild(s)}
    document.body.appendChild(w);}
}

async function start(){
  const tok=ls.get(TOKKEY);
  if(!tok){lockUI('');return}
  loading('ログインを確認しています…');
  let r=null; try{r=await call('resume',tok,DEV,UA(),await geo())}catch(e){lockUI('通信できませんでした（'+String(e&&e.message||e).slice(0,120)+'）');return}
  if(!r.ok){ls.del(TOKKEY);return lockUI(r.reason==='kicked'?'別の端末でログインされたので、この端末はログアウトしました。':r.msg||'')}
  HASPASS=!!r.hasPass; boot(tok,r.me);
}
start();
})();
</script>
</body></html>
